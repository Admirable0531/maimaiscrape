server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, with a short TTL so nginx re-resolves "api"
    # instead of caching its IP forever — same reasoning as jap-bot's
    # frontend/nginx.conf (recreating the api container on every deploy
    # would otherwise leave this pointed at a dead IP).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # This site is meant to be reachable from the public internet (via
        # Cloudflare Tunnel) — the raw Express API behind it also has
        # unauthenticated POST endpoints that trigger Puppeteer scrapes
        # (/run-update-user-data etc.), which this frontend never calls and
        # which must never be reachable through here. Only GET is allowed;
        # everything else is rejected before it reaches the API at all.
        limit_except GET {
            deny all;
        }

        # Strips the /api prefix (the Express app's real routes have none,
        # e.g. GET /users not GET /api/users) while still going through the
        # resolver above for dynamic re-resolution.
        set $api_upstream api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
