name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Runs directly on the Pi itself (registered as a self-hosted runner —
    # see README for setup) instead of GitHub's cloud SSHing into the home
    # network. The old approach depended on SSH_HOST/SSH_USER/SSH_KEY
    # secrets plus a router port-forward and/or DDNS staying correct — one
    # of those silently broke around January 2026 and every deploy since
    # has failed at the SSH step (~30s, connection-level, never even
    # reaching git pull). A self-hosted runner polls outward to GitHub
    # instead, so nothing needs to be reachable from the internet at all.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /home/ryan/Desktop/maimai/maimaiscrape
          git pull
          docker compose down
          docker compose up -d --build
