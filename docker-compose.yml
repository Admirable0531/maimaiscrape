version: "3.9"

services:
  bot:
    build:
      context: ./Discord_Bot
    container_name: discord_bot
    env_file:
      - .env
    volumes:
      - ./Discord_Bot:/app
    working_dir: /app
    command: ["node", "."]
    depends_on:
      - mongodb
    restart: unless-stopped
    environment:
      - TZ=Asia/Kuala_Lumpur
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:4.4.18
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - TZ=Asia/Kuala_Lumpur
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper:
    build:
      context: .
    container_name: selenium_scraper
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - TZ=Asia/Kuala_Lumpur
      - USE_XVFB=1
    volumes:
      - ./screenshots:/app/screenshots
      - /dev/shm:/dev/shm
    working_dir: /app
    command: ["python", "-u", "/app/update_user_data.py"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
