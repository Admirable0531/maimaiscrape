services:
  # Discord bot. Owns every schedule:
  #   DAILY_PIPELINE_AT (default 22:45) -> scrape top scores, scrape friend list,
  #                                        post score diff, post friend leaderboard
  #   CIRCLE_RUN_AT     (default 06:30) -> scrape circle rankings, then daily points
  bot:
    build:
      context: .
      dockerfile: Discord_Bot/Dockerfile
    container_name: discord_bot
    env_file:
      - .env
    working_dir: /app
    command: ["node", "Discord_Bot/index.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    environment:
      - TZ=Asia/Kuala_Lumpur
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:4.4.18
    container_name: mongodb
    # NOTE: this publishes an unauthenticated MongoDB on the host's port 27017.
    # Change to "127.0.0.1:27017:27017" (or drop it) unless you need access from
    # another machine — the other services reach it over the compose network.
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - TZ=Asia/Kuala_Lumpur
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Express api: web endpoints plus the Puppeteer jobs the bot triggers
  # (/run-update-user-data, /run-update-score, /run-friends-webhook).
  api:
    build:
      context: .
      dockerfile: Discord_Bot/Dockerfile
    container_name: express_api
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    working_dir: /app
    command: ["node", "server/express_server.js"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Kuala_Lumpur
    volumes:
      # Debug screenshots land here when SCREENSHOT_DEBUG=1
      - ./screenshots:/app/screenshots
      - /dev/shm:/dev/shm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Manual-only: the bot now owns the daily schedule, so this no longer runs a
  # competing cron. Kept for one-off runs:
  #   docker compose run --rm scraper node server/update_user_data.js
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: puppeteer_scraper
    profiles: ["manual"]
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=Asia/Kuala_Lumpur
      - SCRAPER_CRON_ENABLED=${SCRAPER_CRON_ENABLED:-false}
    volumes:
      - ./screenshots:/app/screenshots
      - /dev/shm:/dev/shm
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: maimai_web
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Kuala_Lumpur
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
